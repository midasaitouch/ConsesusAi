<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.4"/>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-dasharray="20 8" opacity="0.5"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="115" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.3"/>

  <!-- Center orb -->
  <circle cx="256" cy="256" r="80" fill="url(#grad)" opacity="0.15"/>

  <!-- Star/sparkle symbol -->
  <text x="256" y="290" font-family="system-ui, -apple-system, sans-serif"
    font-size="120" text-anchor="middle" fill="url(#grad)" font-weight="900"
    style="filter: drop-shadow(0 0 20px rgba(99,102,241,0.8))">✦</text>

  <!-- Orbital dots -->
  <circle cx="256" cy="66" r="8" fill="#6366f1" opacity="0.8"/>
  <circle cx="446" cy="256" r="6" fill="#22d3ee" opacity="0.7"/>
  <circle cx="256" cy="446" r="8" fill="#818cf8" opacity="0.8"/>
  <circle cx="66"  cy="256" r="6" fill="#22d3ee" opacity="0.7"/>

  <!-- Small accent dots -->
  <circle cx="386" cy="126" r="5" fill="#e879f9" opacity="0.6"/>
  <circle cx="126" cy="386" r="5" fill="#4ade80" opacity="0.6"/>
  <circle cx="386" cy="386" r="4" fill="#f97316" opacity="0.5"/>
  <circle cx="126" cy="126" r="4" fill="#22d3ee" opacity="0.5"/>
</svg>
